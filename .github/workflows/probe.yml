name: Probe sources (temporary)
on: { workflow_dispatch: }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          D=$(date -u -d '-1 day' +%Y%m%d); T=$(date -u +%Y%m%d)
          for u in \
           "https://www.nseindia.com/api/historical/bulk-deals?from=01-08-2026&to=03-11-2026" \
           "https://www.nseindia.com/api/historical/block-deals?from=01-08-2026&to=03-11-2026" \
           "https://www.nseindia.com/api/historical/bulk-deals?symbol=GTLINFRA&from=01-08-2025&to=03-11-2026" \
           "https://www.nseindia.com/api/corporate-announcements?index=equities&symbol=GTLINFRA&from_date=01-05-2026&to_date=03-11-2026" \
           "https://www.nseindia.com/api/corporate-announcements?index=sme&symbol=AASTHA&from_date=01-05-2026&to_date=03-11-2026" \
           "https://www.nseindia.com/api/corporate-share-holdings-master?index=sme&symbol=AASTHA" \
           "https://www.nseindia.com/api/corporate-pledgedata?index=equities" \
           "https://www.nseindia.com/api/corp-info?symbol=GTLINFRA&corpType=shareholdings&market=equities" \
           "https://api.bseindia.com/BseIndiaAPI/api/AnnGetData/w?strCat=-1&strPrevDate=20261101&strScrip=&strSearch=P&strToDate=20261103&strType=C" \
           "https://www.bseindia.com/xml-data/corpfiling/AttachLive/" \
           "https://www.bseindia.com/data/xml/notices.xml" \
           "https://www.bseindia.com/markets/downloads/bulk_deals.csv" ; do
            c=$(curl -s -m 20 -L -A "$UA" -H "Referer: https://www.bseindia.com/" -H "Origin: https://www.bseindia.com" -H "Accept: application/json, text/plain, */*" --compressed -H "Accept-Language: en-US,en;q=0.9" -H "sec-fetch-site: same-site" -H "sec-fetch-mode: cors" -o /tmp/o -w "%{http_code} %{size_download}" "$u"); echo "## $c $u"; head -c 300 /tmp/o; echo; done
