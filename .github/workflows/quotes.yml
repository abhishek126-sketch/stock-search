name: Quotes refresh (loops every 5 min in market hours)
# GitHub drops many 5-minute cron runs, so one run loops through the session (scripts/quotes_loop.sh).
# Several spaced cron triggers are backups: the concurrency group keeps one active run (+1 queued);
# a run that starts while another is still looping just waits, then exits quickly if the market has closed.
on:
  schedule:
    - cron: '40 3 * * 1-5'    # 09:10 IST  India session start
    - cron: '10 5 * * 1-5'    # backups during India hours (in case the start trigger is dropped/late)
    - cron: '40 6 * * 1-5'
    - cron: '10 8 * * 1-5'
    - cron: '25 9 * * 1-5'
    - cron: '25 13 * * 1-5'   # 18:55 IST  US session start
    - cron: '55 14 * * 1-5'   # backups during US hours
    - cron: '25 16 * * 1-5'
    - cron: '55 17 * * 1-5'
    - cron: '25 19 * * 1-5'
    - cron: '45 20 * * 1-5'
    - cron: '17 */3 * * *'    # off-hours/weekends: single refresh every 3 h
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-quotes, cancel-in-progress: false }
jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "scripts\n.github", fetch-depth: 1 }
      - run: git clone -q --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pub
      - name: Refresh loop (quotes + cross-check + publish + price alerts)
        run: bash scripts/quotes_loop.sh
        env:
          FINNHUB_KEY: '${{ secrets.FINNHUB_KEY }}'
          REPO_URL: 'https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git'
