name: Save alerts (from app)
on:
  workflow_dispatch:
    inputs:
      alerts: { description: 'alerts.json content (sent by the app)', required: true }
permissions:
  contents: write
concurrency: { group: alerts, cancel-in-progress: false }
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts, fetch-depth: 1 }
      - name: Clone alerts branch
        run: git clone -q --depth 1 --branch alerts "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" al || (mkdir al && cd al && git init -q && git checkout -q -b alerts && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git")
      - run: python3 scripts/alerts.py save
        env: { ALERTS_IN: '${{ inputs.alerts }}' }
