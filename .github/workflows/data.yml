name: Full refresh (fundamentals, news, analysts)
on:
  schedule:
    # GitHub delays/drops cron runs, so each slot has backups; a backup skips itself if a full refresh ran < 100 min ago.
    - cron: '20 3 * * 1-5'    # 08:50 IST pre-open
    - cron: '50 3 * * 1-5'    #   backup
    # Evening: NSE publishes its official closing file (bhavcopy) a few hours after the 15:30 close. This run sets every
    # NSE stock to NSE's official close and recomputes all metrics and scores. Backups run only until that has happened today.
    - cron: '30 13 * * 1-5'   # 19:00 IST
    - cron: '0 15 * * 1-5'    #   backup 20:30 IST
    - cron: '30 16 * * 1-5'   #   backup 22:00 IST
    - cron: '30 21 * * 1-5'   # 03:00 IST after US close
    - cron: '10 22 * * 1-5'   #   backup
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build_data.py', 'scripts/crosscheck.py', 'indicators.js', 'scripts/swing.js', 'scripts/momentum.js', 'scripts/nsedaily.js', 'scripts/dmascan.js', 'dmasetup.js', 'scripts/plan.js', 'scripts/planrules.js', 'scripts/planstats.js', 'scripts/backtest.js', 'scripts/simengine.js', 'scripts/track.js', 'planport.js', '.github/workflows/data.yml']
permissions:
  contents: write
  actions: write
concurrency: { group: data-full, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Check out data branch (depth 1)
        run: git clone -q --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pub && cp -r pub/data ./data || (mkdir -p pub && cd pub && git init -q && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git")
      - name: Skip if not needed (scheduled runs only)
        if: github.event_name == 'schedule'
        # evening slots (after 18:00 IST): skip once NSE's and BSE's official closes for today have both been applied
        # (the 22:00 slot runs only if NSE's is still missing, so a missing BSE file can't keep it running);
        # other slots: skip if a full refresh ran in the last 100 min
        run: |
          python3 - <<'EOF' || { echo 'not needed - skipping'; echo SKIP=1 >> $GITHUB_ENV; }
          import json, time, sys, datetime as dt
          m = json.load(open('pub/data/meta.json'))
          now = dt.datetime.now(dt.timezone(dt.timedelta(hours=5, minutes=30)))
          today = now.date().isoformat()
          if now.hour >= 18: sys.exit(0 if m.get('nseDay') != today or (m.get('bseDay') != today and now.hour < 21) else 1)
          sys.exit(0 if time.time() - m.get('full', 0) > 6000 else 1)
          EOF
      - name: NSE bonus / split list (used by build_data.py to fix Yahoo's unadjusted or mis-dated adjustments)
        if: env.SKIP != '1'
        run: node scripts/nsedaily.js --ca || echo 'bonus / split list skipped'
      - if: env.SKIP != '1'
        run: python3 scripts/build_data.py
      - name: NSE delivery % and corporate actions
        if: env.SKIP != '1'
        run: node scripts/nsedaily.js || echo 'nse daily extras skipped'
      - name: Swing-trade setups (from official closing prices)
        if: env.SKIP != '1'
        run: node scripts/swing.js || echo 'swing setups skipped'
      - name: Earnings-momentum scan (profits from the exchange-data job)
        if: env.SKIP != '1'
        run: node scripts/momentum.js || echo 'momentum scan skipped'
      - name: DMA setups scan (Best / Strongest, rules in dmasetup.js)
        if: env.SKIP != '1'
        run: node scripts/dmascan.js || echo 'dma scan skipped'
      - name: Daily plan history check (weekly; skips itself when fresh)
        if: env.SKIP != '1'
        run: node scripts/planstats.js || echo 'plan history check skipped'
      - name: Daily plan history test (whole pipeline with costs; weekly, skips itself when fresh)
        if: env.SKIP != '1'
        run: node scripts/backtest.js || echo 'history test skipped'
      - name: Daily plan (market regime, rules, buy / watch / avoid)
        if: env.SKIP != '1'
        run: node scripts/plan.js || echo 'daily plan skipped'
      - name: Paper portfolio (forward test of the plan)
        if: env.SKIP != '1'
        run: node scripts/track.js || echo 'paper portfolio skipped'
      - if: env.SKIP != '1'
        run: python3 scripts/build_quotes.py || true
      - name: Cross-check (NSE / Finnhub)
        if: env.SKIP != '1'
        run: python3 scripts/crosscheck.py || echo 'cross-check skipped'
        env: { FINNHUB_KEY: '${{ secrets.FINNHUB_KEY }}' }
      - if: env.SKIP != '1'
        run: bash .github/workflows/publish.sh all
      - name: Make sure a quotes loop is running (GitHub drops/delays scheduled runs)
        if: always()
        run: gh workflow run quotes.yml --ref main || true
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
